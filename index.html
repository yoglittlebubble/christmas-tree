<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070b16'/%3E%3Cpath d='M32 7 L40 28 L61 31 L45 44 L50 61 L32 49 L14 61 L19 44 L3 31 L24 28 Z' fill='%23f6d089'/%3E%3C/svg%3E"
    />
    <title>雪地暖光小屋 · Merry Christmas</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="vignette"></div>

    <header class="hero">
      <p class="eyebrow">A LITTLE WINTER NIGHT</p>
      <h1>Merry Christmas</h1>
    </header>

    <div class="panel" id="panel">
      <p class="panel-title">场景控制</p>
      <div class="panel-row">
        <button class="toggle is-on" data-key="snow" aria-pressed="true">飘雪</button>
        <button class="toggle is-on" data-key="lights" aria-pressed="true">室内灯光</button>
      </div>
      <label class="slider-row" for="brightness">
        <span>室内亮度</span>
        <input id="brightness" type="range" min="0" max="100" step="1" value="82" />
        <output id="brightness-value" for="brightness">82%</output>
      </label>
      <button class="toggle is-on" data-key="rotate" aria-pressed="true">自动旋转</button>
      <button class="toggle" data-key="music" aria-pressed="false">背景音乐</button>
    </div>

    <div class="curtain" id="curtain"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
